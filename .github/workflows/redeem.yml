name: Whiteout Survival Auto Redeem

on:
  # 1. Automatic run on a schedule (e.g. Every 6 hours at minute 0)
  schedule:
    - cron: '0 */6 * * *'

  # 2. Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      gift_codes:
        description: 'Optional manual codes (leave empty to use Sheet codes only)'
        required: false
        default: ''

jobs:
  redeem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Auto Redeemer
        env:
          INPUT_GIFT_CODES: ${{ github.event.inputs.gift_codes }}
        run: python main.py

      - name: Commit and Save Logs & History Memory
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add redemption_history.json redemption.log
          git commit -m "Scheduled run: Auto-update redemption history and logs" || exit 0
          git push
