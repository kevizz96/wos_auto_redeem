name: Whiteout Survival Auto Redeem

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      gift_codes:
        description: 'Optional manual codes (space or comma separated)'
        required: false
        default: ''

# Grants write access to commit history and logs back to the repo
permissions:
  contents: write

jobs:
  redeem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Auto Redeemer
        env:
          INPUT_GIFT_CODES: ${{ github.event.inputs.gift_codes }}
        run: python main.py

      - name: Commit and Save Logs & History Memory
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add redemption_history.json redemption.log
          git commit -m "Scheduled run: Auto-update redemption history and logs" || exit 0
          git pull --rebase origin main
          git push
